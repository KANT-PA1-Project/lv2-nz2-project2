# nz2_swerve_nav/config/nav_test_goals.yaml — 5단계 Nav2 시험 목표 (map = mission 좌표, m / deg)
# yaw_deg = 로봇 정면(팔 쪽, base_footprint +x) 방향. 0 = +X(지도 오른쪽), 90 = +Y(위)
#
# 접근점 = 박스 면에서 0.35 m (로봇 중심) [가정]: 로봇 앞 끝 0.2175 + 박스 면까지 간격 약 0.13 m
#   팔 작업 거리 확정되면 이 값만 바꿔 다시 생성 (Claude 가 지도에서 박스 중심 검출 → 4면 중 도달 가능·여유 ≥ 0.26 m 인 면만 남김)
# 발자국(조향 0° 외곽 + 10 mm) 기준 지도 벽까지 최소 여유를 점마다 계산함 (11/14). 50 mm 미만은 주석 표시
# 박스 중심 (nz2_maze_sim_v2 지도에서 검출, 오차 ±20 mm):
#   L1 (3.687, 0.991)  L3 (3.647, 5.411)
#   (11/14) mission.pdf 수정: 중앙 큰 선반(받침대, (2.207, 3.531) 0.86 m) 삭제 → 지도 v3 에서도 지움. L2 목표 → CENTER(빈 자리) 통과 시험으로 대체
#   그 외 (1.487, 0.981) (3.677, 3.191) (3.657, 3.931) (0.717, 5.371) (2.177, 5.381) (2.927, 5.401)

routes:
  # 1차: 몸 방향 고정(yaw 0) — 병진만. MPPI Omni·AMCL·footprint 기본 확인
  basic:
    - {name: L1_W,    x: 3.207, y: 0.991, yaw_deg: 0}     # L1 서쪽 면, 정면 = 박스 (여유 0.30)
    - {name: CENTER,  x: 2.207, y: 3.531, yaw_deg: 0}     # 받침대가 있던 자리 (지금은 빈 공간)
    - {name: L3_S,    x: 3.710, y: 4.931, yaw_deg: 0}     # L3 남쪽. 박스 중심보다 +63 mm 동쪽 (서쪽 벽 끝 기둥 때문, 여유 65 mm). 서쪽 면은 옆 박스와 0.46 m 라 불가
    - {name: START,   x: 0.734, y: 0.950, yaw_deg: 0}

  # 2차: 박스를 정면으로 보고 서기 (회전 포함). 1차 통과 후
  facing:
    - {name: L1_S,    x: 3.687, y: 0.511, yaw_deg: 90}    # 여유 0.36
    - {name: CENTER,  x: 2.207, y: 3.531, yaw_deg: 90}    # 넓은 곳에서 90° 회전
    - {name: L3_S,    x: 3.710, y: 4.931, yaw_deg: 90}    # 박스 중심 +63 mm 동쪽 (여유 83 mm)
    - {name: B5371_N, x: 0.717, y: 5.841, yaw_deg: -90}   # 왼쪽 위 박스 북쪽 (여유 122 mm, 위 통로 0.83 m 로 넓음)
    - {name: START,   x: 0.734, y: 0.950, yaw_deg: 0}

  # (11/15) 좁은 목 시험: B5371_S 는 남동쪽에서 들어가는 길이 기둥 두 개 사이 0.54 m 틈(로봇 0.455 m, 한쪽 42 mm)
  #   + 틈 직후 꺾임 → facing 4·5차 모두 목표 0.7 m 전 정체. 미션에서는 B5371_N 으로 접근 권장
  hard:
    - {name: B5371_S, x: 0.717, y: 4.901, yaw_deg: 90}
    - {name: START,   x: 0.734, y: 0.950, yaw_deg: 0}

  # 지도에서 도달 가능한 접근점 전체 (참고용, 한 번에 돌리면 약 10분+)
  all:
    - {name: B1487_E, x: 1.967, y: 0.981, yaw_deg: 180}
    - {name: B1487_S, x: 1.487, y: 0.501, yaw_deg: 90}
    - {name: L1_E,    x: 4.167, y: 0.991, yaw_deg: 180}
    - {name: L1_W,    x: 3.207, y: 0.991, yaw_deg: 0}
    - {name: L1_S,    x: 3.687, y: 0.511, yaw_deg: 90}
    - {name: B3191_E, x: 4.147, y: 3.191, yaw_deg: 180}
    - {name: B3931_W, x: 3.187, y: 3.931, yaw_deg: 0}
    - {name: CENTER,  x: 2.207, y: 3.531, yaw_deg: 0}
    - {name: B5371_N, x: 0.717, y: 5.841, yaw_deg: -90}
    - {name: B5371_S, x: 0.717, y: 4.901, yaw_deg: 90}
    - {name: B5381_N, x: 2.177, y: 5.851, yaw_deg: -90}
    - {name: B5381_W, x: 1.707, y: 5.381, yaw_deg: 0}
    - {name: B5401_N, x: 2.927, y: 5.881, yaw_deg: -90}
    - {name: B5401_S, x: 2.927, y: 4.921, yaw_deg: 90}
    - {name: L3_E,    x: 4.127, y: 5.411, yaw_deg: 180}
    - {name: L3_N,    x: 3.647, y: 5.891, yaw_deg: -90}   # 여유 25 mm (좁음)
    - {name: L3_S,    x: 3.710, y: 4.931, yaw_deg: 90}
    - {name: START,   x: 0.734, y: 0.950, yaw_deg: 0}
