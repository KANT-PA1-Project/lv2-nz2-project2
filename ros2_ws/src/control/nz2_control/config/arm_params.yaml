# =============================================================
# 패키지 : nz2_control
# 파일   : config/arm_params.yaml
# 역할   : 팔 관절 모터 ID·관절 범위·전류 제한 (arm_controller_node)
#
# [해야 할 일 / TODO]
#   - XM430-W350 관절 + 손목 롤 추가 관절. 값은 TODO: 구글시트 기준으로 채우기
# [안전]  관절 범위 밖 명령 금지, 전류 제한 초과 시 정지
# =============================================================
arm_controller_node:
  ros__parameters:
    joint_names: [joint1, joint2, joint3, joint4, joint5_wrist_roll, gripper]
    motor_ids: [11, 12, 13, 14, 16, 15] # joint_names 순서. 손목 롤=ID16, 그리퍼=ID15
    # 관절 가동범위 [rad]: 2026-10-27 실기 측정·확정 (기계/케이블 끝에서 7° 안쪽).
    # nz2_description/urdf/arm.xacro의 limit과 같은 값. [가정] 모터 부호 +1 (확인 필요)
    # 그리퍼: 0 = 완전 열림, 음수 = 닫힘 (-134° .. -3°). URDF에는 관절 없음(잠금)
    # joint4: 접힌 자세에서는 +6.5°(0.1134 rad)까지만 (인터락, 펌웨어가 막음)
    joint_min_rad: [-3.0543, -1.6581, -1.9373, -1.7279, -2.9671, -2.3387]
    joint_max_rad: [3.0543, 1.9722, 1.4312, 2.0420, 2.9671, -0.0524]
    max_current_ma: [0, 0, 0, 0, 0, 0]  # TODO
    gripper_stroke_m: [0.0, 0.0]        # [최소, 최대] (TODO)
