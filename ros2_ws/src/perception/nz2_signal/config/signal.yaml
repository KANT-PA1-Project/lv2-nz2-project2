# 신호 점멸 해독 파라미터. [가정] 값은 실물 신호등 앞에서 측정 후 교체한다.
# 신호등 위치·점등 판정·노출은 nz2_perception(traffic_light_filter)의 파라미터에서 정한다.
signal_decoder:
  ros__parameters:
    traffic_light_topic: /perception/traffic_light   # nz2_interfaces/TrafficLight (PR #22)
    # 신호 시간 구조: 1초 켜짐 + 1초 소등, 12번째 뒤 3초 소등, 주기 26초
    on_min_s: 0.6
    on_max_s: 1.4
    off_min_s: 0.4
    intra_off_max_s: 1.5
    gap_min_s: 2.5
    gap_max_s: 3.5
    frame_span_s: 23.0
    frame_span_tol_s: 1.0
    blinks_per_frame: 12
    count_min: 1
    count_max: 6
    k_agree: 3                        # 같은 문자열 K회 → 확정 [팀 기준 확인]
    min_margin: 2
    max_frames: 8                     # 약 3.5분 내 미확정 → failed
    max_sample_gap_s: 0.3
