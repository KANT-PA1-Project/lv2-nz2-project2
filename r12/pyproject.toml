[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-practice"
version = "0.1.0"
description = "Own-URDF manipulator practice for Isaac Lab 3.0 EA and ROS 2 Lyrical"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.entry-points."isaaclab.tasks"]
arm_practice = "arm_practice.tasks"

[tool.setuptools.packages.find]
where = ["src"]
