# 가제보(gz_ros2_control)용 컨트롤러. 조향=position, 휠=velocity. 조인트명은 r21_description.
# Lyrical(ros2_controllers 5.x)에는 JointGroupPosition/VelocityController 가 없으므로
# ForwardCommandController 로 인터페이스만 지정해 쓴다.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    steer_position_controller:
      type: forward_command_controller/ForwardCommandController
    wheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController

steer_position_controller:
  ros__parameters:
    interface_name: position
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint

wheel_velocity_controller:
  ros__parameters:
    interface_name: velocity
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
