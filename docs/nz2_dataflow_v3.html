<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZ2 Dataflow</title>
<style>
:root{--bar:#17325f;--ink:#152238;--muted:#5d6b82;--line:#d5dbe5;
  --topic:#0b3d91;--fb:#55606f;--srv:#c25e00;--act:#7a3fb0;--tf:#1f7a52;--hw:#4a5260;--red:#cf2e2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;color:var(--ink);background:#f3f5f9;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--bar);color:#fff}
header h1{font-size:16px;margin:0 10px 0 0;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;background:#fff;color:var(--ink)}
.tabs button.on{background:#ffd666;font-weight:700}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px}
.tools span{min-width:44px;text-align:center}
#legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:12.5px}
#legend .s{display:inline-flex;align-items:center;gap:6px}
.box{display:inline-block;width:30px;height:16px;border-radius:4px}
.mono{font-family:ui-monospace,"JetBrains Mono",Consolas,"D2Coding",monospace}
#main{flex:1;min-height:0;display:flex}
#stage{flex:1;min-width:0;position:relative;overflow:hidden;cursor:grab;background:#fff}
#stage.drag{cursor:grabbing}
#svg{position:absolute;left:0;top:0;transform-origin:0 0}
#info{width:300px;flex:none;background:#fff;border-left:1px solid var(--line);padding:14px 16px;overflow:auto;font-size:13px}
#info h2{font-size:15px;margin:6px 0 2px;word-break:break-all}
#info .k{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;background:#eef2f8}
#info .t{color:var(--muted);margin:4px 0 10px}
#info h3{font-size:12px;color:var(--muted);margin:14px 0 4px}
#info ul{margin:0;padding-left:18px}
#info li{margin:3px 0}
#info li .mono{color:var(--topic)}
#info a{color:#1f4fa8;cursor:pointer;text-decoration:underline}
#info .ph{color:var(--muted);line-height:1.65}
.it.link{cursor:pointer}
.lab{cursor:pointer}
.dim .it:not(.hl),.dim .ed:not(.hl),.dim .lab:not(.hl){opacity:.12}
#catalog{display:none;flex:1;min-width:0;overflow:auto;background:#fff;padding:18px 20px}
#catalog.open{display:block}
#catalog .catalog-meta{margin-bottom:14px;color:#60738f;line-height:1.7;font-size:13px}
#catalog .cbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#catalog input{border:1px solid #d6dfec;border-radius:6px;padding:8px 10px;width:300px;font:inherit;font-size:13px}
#catalog .chip{border:1px solid #d6dfec;background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
#catalog .chip.on{background:#17325f;color:#fff;border-color:#17325f}
#catalog table{width:100%;border-collapse:collapse;font-size:12.5px}
#catalog th{text-align:left;background:#edf3fa;position:sticky;top:-18px;z-index:1}
#catalog td,#catalog th{padding:9px 10px;border-bottom:1px solid #e3e9f1;vertical-align:top;overflow-wrap:anywhere}
#catalog tr[data-c]{cursor:pointer}
#catalog tr[data-c]:hover{background:#f2f7fe}
#catalog tr.sel{background:#fff4dc}
#catalog td small{color:#6a7d97}
.ktag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;color:#fff;white-space:nowrap}
.ptag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:#fff1d6;color:#8a5a00;border:1px solid #e6c88a;margin-left:4px}
#info .cbtn{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;background:#f9fbfd;border:1px solid #dce5f1;border-radius:6px;cursor:pointer;font-size:12.5px}
#info .cbtn small{display:block;color:#63738b;margin-top:3px;overflow-wrap:anywhere}
#info code{font:12px ui-monospace,Consolas,monospace;background:#f0f4f9;padding:2px 5px;border-radius:3px;overflow-wrap:anywhere}
@media (max-width:760px){#info{display:none}#catalog input{width:100%}}
</style>
</head>
<body>
<header>
  <h1>NZ2 시스템 데이터 플로우</h1>
  <div class="tabs" id="tabs"></div>
  <div class="tools"><button id="zo">−</button><span id="zl"></span><button id="zi">+</button>
    <button id="fit">전체 보기</button><button id="fith">높이 맞춤</button></div>
</header>
<div id="legend">
  <span class="s"><span class="box" style="background:#dae8fc;border:2px solid #6c8ebf"></span><b>노드</b> (파란 상자 · 굵은 글씨)</span>
  <span class="s"><span class="box" style="background:#ffe6cc;border:2.6px solid #d79b00"></span><b>master 노드</b> · 클릭하면 세부</span>
  <span class="s"><span class="box" style="background:#fff;border:1.5px dashed #8a94a3"></span>다른 계층 노드 · 클릭하면 이동</span>
  <span class="s"><span class="box" style="background:#f5f5f5;border:1.5px solid #666;border-radius:0"></span>하드웨어</span>
  <span class="s"><span class="box" style="background:#d5e8d4;border:1.5px solid #82b366"></span>OpenCR 펌웨어</span>
  <span class="s"><span class="box" style="background:#fff;border:1.5px solid #000;border-radius:0"></span>파일</span>
  <span class="s">→ 화살표 위 <span class="mono" style="color:var(--topic);font-weight:600">/고정폭/글씨</span> = <b>토픽</b></span>
  <span class="s"><span class="mono" style="color:var(--fb)">- - 점선</span> = 피드백</span>
  <span class="s"><span class="mono" style="color:var(--srv);font-weight:600">srv</span> 서비스 · <span class="mono" style="color:var(--act);font-weight:600">action</span> 액션 · <span class="mono" style="color:var(--tf);font-weight:600">TF</span> 좌표변환</span>
</div>
<div id="main">
  <div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="catalog"></div>
  <aside id="info"></aside>
</div>

  const row = (e, other) => '<li>' + e.lines.map(l => '<span class="mono">' + l + '</span>').join('<br>') + ' <br><span style="color:#5d6b82">' + (other) + '</span></li>';
  const ins = page.edges.filter(e => e.to === id), outs = page.edges.filter(e => e.from === id);
  info.innerHTML = '<span class="k">' + KN[it.kind] + '</span><h2>' + it.label + '</h2><div class="t">' + (it.sub || '') + '</div>' +
    '<h3>입력 (구독)</h3>' + (ins.length ? '<ul>' + ins.map(e => row(e, '← ' + nm(e.from))).join('') + '</ul>' : '<div class="t">없음</div>') +
    '<h3>출력 (발행)</h3>' + (outs.length ? '<ul>' + outs.map(e => row(e, '→ ' + nm(e.to))).join('') + '</ul>' : '<div class="t">없음</div>');
}
function showTopic(k) {
  const e = page.edges[k];
  let h = '<span class="k">' + KS[e.style] + '</span>';
  e.lines.forEach(ln => {
    const pubs = new Set(), subs = new Set();
    page.edges.forEach(x => { if (x.lines.includes(ln)) { pubs.add(nm(x.from)); subs.add(nm(x.to)); } });
    h += '<h2 class="mono">' + ln + '</h2><h3>발행 (publisher)</h3><ul>' + [...pubs].map(p => '<li>' + p + '</li>').join('') +
      '</ul><h3>구독 (subscriber)</h3><ul>' + [...subs].map(p => '<li>' + p + '</li>').join('') + '</ul>';
  });
  info.innerHTML = h; hlEdge(k);
}

function applyT() { svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; document.getElementById('zl').textContent = Math.round(scale * 100) + '%'; }
function zoomAt(f, cx, cy) { const ns = Math.max(.15, Math.min(3, scale * f)); tx = cx - (cx - tx) * ns / scale; ty = cy - (cy - ty) * ns / scale; scale = ns; applyT(); }
function fitAll() { const r = stage.getBoundingClientRect(); scale = Math.min(r.width / page.width, r.height / page.height) * .98; tx = (r.width - page.width * scale) / 2; ty = 4; applyT(); }
function fitHeight() { const r = stage.getBoundingClientRect(); scale = Math.min(1.3, (r.height - 8) / page.height); tx = page.width * scale < r.width ? (r.width - page.width * scale) / 2 : 0; ty = 4; applyT(); }
let drag = null;
stage.addEventListener('pointerdown', e => { if (e.target.closest('.it,.lab')) return; drag = { x: e.clientX - tx, y: e.clientY - ty, m: 0 }; stage.classList.add('drag'); });
window.addEventListener('pointermove', e => { if (!drag) return; drag.m = 1; tx = e.clientX - drag.x; ty = e.clientY - drag.y; applyT(); });
window.addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag'); });
stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect();
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) { tx -= (e.deltaX || e.deltaY); applyT(); }
  else zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
stage.addEventListener('click', e => { if (!e.target.closest('.it,.lab')) { hl(null); placeholder(); } });
document.getElementById('zi').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); };
document.getElementById('zo').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); };
document.getElementById('fit').onclick = fitAll; document.getElementById('fith').onclick = fitHeight;
window.addEventListener('resize', fitHeight);
const tabs = document.getElementById('tabs');
PAGES.forEach(p => { const b = document.createElement('button'); b.textContent = p.name; b.dataset.id = p.id; b.onclick = () => render(p.id); tabs.appendChild(b); });
{ const b = document.createElement('button'); b.textContent = '4. 연결 명세'; b.dataset.id = 'contracts'; b.onclick = () => renderContracts(); tabs.appendChild(b); }

// ===================== 연결 명세 탭 =====================
const KC = { topic: '#0b3d91', service: '#c25e00', action: '#7a3fb0', tf: '#1f7a52', hardware: '#4a5260' };
const KNAME = { topic: 'TOPIC', service: 'SERVICE', action: 'ACTION', tf: 'TF', hardware: 'HARDWARE' };
const LNAME = { driver: 'Drivers', perception: 'Perception', decision: 'Decision', planning: 'Planning', control: 'Control', lowlevel: 'Low-level', hardware: 'Hardware' };
const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cat = document.getElementById('catalog'), legendEl = document.getElementById('legend'), toolsEl = document.querySelector('.tools');
let cq = '', ckind = 'all', csel = null;
function modeDiagram(on) {
  stage.style.display = on ? '' : 'none'; cat.classList.toggle('open', !on);
  legendEl.style.display = on ? '' : 'none'; toolsEl.style.visibility = on ? '' : 'hidden';
}
const ktag = k => '<span class="ktag" style="background:' + KC[k] + '">' + KNAME[k] + '</span>';
const nodeOf = id => CT.nodes[id];
const descr = n => n.file + ' ' + n.name + ' ' + n.path + ' ' + n.role;
function renderContracts() {
  modeDiagram(false);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.id === 'contracts'));
  try { history.replaceState(null, '', '#contracts'); } catch (e) {}
  cat.innerHTML = '<div class="cbar"><input id="cq" type="search" placeholder="파일 · 노드 · 토픽 · 타입 검색" value="' + esc(cq) + '">' +
    ['all', 'topic', 'service', 'action', 'tf', 'hardware'].map(k => '<button class="chip' + (ckind === k ? ' on' : '') + '" data-k="' + k + '">' + (k === 'all' ? '전체' : KNAME[k]) + '</button>').join('') + '</div><div id="ctable"></div>';
  const inp = document.getElementById('cq');
  inp.oninput = e => { cq = e.target.value.toLowerCase(); table(); };
  cat.querySelectorAll('.chip').forEach(c => c.onclick = () => { ckind = c.dataset.k; renderContracts(); document.getElementById('cq').focus(); });
  table();
  if (csel) showContract(csel); else contractsHelp();
}
function table() {
  const m = CT.edges.filter(e => (ckind === 'all' || e.kind === ckind) &&
    (e.name + ' ' + e.type + ' ' + descr(nodeOf(e.a)) + ' ' + descr(nodeOf(e.b))).toLowerCase().includes(cq));
  document.getElementById('ctable').innerHTML = '<div class="catalog-meta"><b>연결 명세 ' + m.length + '개</b> · 행을 클릭하면 오른쪽에 메시지 필드·송수신 주체·관리 역할이 열립니다.<br>' +
    '패키지: ros2_ws/src/perception · planning · control  |  언어: perception · control = C++(rclcpp), planning = Python(rclpy)<br>[가정] mission_fsm은 planning, swerve/arm_bridge는 control 패키지 · 커스텀 타입은 ros2_ws/src/nz2_interfaces 패키지에 정의 (행 클릭 시 필드 표시) · 노드 파일명은 설계안입니다.</div>' +
    '<table><thead><tr><th>종류</th><th>송신 / 요청 파일</th><th>이름</th><th>타입</th><th>수신 / 처리 파일</th></tr></thead><tbody>' +
    m.map(e => '<tr data-c="' + e.id + '" tabindex="0"' + (csel === e.id ? ' class="sel"' : '') + '><td>' + ktag(e.kind) + '</td><td>' + esc(nodeOf(e.a).file) + '<br><small>' + esc(nodeOf(e.a).name) + '</small></td>' +
      '<td class="mono" style="color:' + KC[e.kind] + ';font-weight:600">' + esc(e.name) + '</td><td class="mono">' + esc(e.type) + '</td><td>' + esc(nodeOf(e.b).file) + '<br><small>' + esc(nodeOf(e.b).name) + '</small></td></tr>').join('') +
    '</tbody></table>';
}
cat.addEventListener('click', e => { const r = e.target.closest('tr[data-c]'); if (r) showContract(r.dataset.c); });
cat.addEventListener('keydown', e => { const r = e.target.closest('tr[data-c]'); if (r && e.key === 'Enter') showContract(r.dataset.c); });
function contractsHelp() {
  info.innerHTML = '<div class="ph"><b>4. 연결 명세</b><br><br>노드 사이의 모든 연결(토픽·서비스·액션·TF·하드웨어)을 한 표로 정리했습니다.<br><br>' +
    '<b>열 읽는 법</b><br>송신 / 요청 파일 → 이름(토픽·서비스명) → 수신 / 처리 파일<br>서비스·액션은 요청 방향이며, 응답·결과는 반대로 돌아옵니다.<br><br>' +
    '<b>조작</b><br>검색창: 파일·노드·토픽·타입으로 찾기<br>종류 버튼: TOPIC / SERVICE / ACTION / TF / HARDWARE 필터<br>행 클릭: 상세 정보</div>';
}
const cbtnNode = id => { const n = nodeOf(id); return '<button class="cbtn" data-n="' + id + '"><b>' + esc(n.file) + '</b><small>' + esc(n.name) + ' · ' + LNAME[n.layer] + '</small></button>'; };
const cbtnEdge = e => '<button class="cbtn" data-c="' + e.id + '">' + ktag(e.kind) + ' <b class="mono">' + esc(e.name) + '</b><small class="mono">' + esc(e.type) + '</small><small>' + esc(nodeOf(e.a).name) + ' → ' + esc(nodeOf(e.b).name) + '</small></button>';
function showContract(id) {
  const e = CT.edges.find(x => x.id === id); if (!e) return; csel = id;
  cat.querySelectorAll('tr[data-c]').forEach(r => r.classList.toggle('sel', r.dataset.c === id));
  const a = nodeOf(e.a), b = nodeOf(e.b), req = e.kind === 'service' || e.kind === 'action';
  info.innerHTML = ktag(e.kind) + (e.proposed ? '<span class="ptag">설계 제안</span>' : '') + '<h2 class="mono">' + esc(e.name) + '</h2><div class="t mono">' + esc(e.type) + '</div>' +
    (e.type.startsWith('nz2_interfaces/') ? '<p class="t">정의 파일: <code>ros2_ws/src/nz2_interfaces/' + esc(e.type.split('/')[1]) + '/' + esc(e.type.split('/')[2]) + '.' + esc(e.type.split('/')[1]) + '</code></p>' : '') +
    '<h3>' + (req ? '요청 / 목표를 보내는 쪽' : e.kind === 'hardware' ? '보내는 쪽' : '발행 / 송신') + '</h3>' + cbtnNode(e.a) +
    '<h3>' + (req ? '처리 / 응답하는 쪽' : e.kind === 'hardware' ? '받는 쪽' : '구독 / 수신') + '</h3>' + cbtnNode(e.b) +
    (req ? '<p class="t">화살표는 요청 방향입니다. 서비스 응답과 액션 피드백·결과는 반대 방향으로 돌아옵니다.</p>' : '') +
    (e.type.startsWith('nz2_interfaces/') ? '<h3>필드 (nz2_interfaces 정의 그대로)</h3><ul>' : '<h3>주요 필드 / 계약</h3><ul>') + e.fields.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>' +
    '<h3>역할 / 동작</h3><p>' + esc(e.note || '해당 인터페이스로 데이터를 직접 전달합니다.') + '</p>' +
    '<h3>관리 책임</h3><p>' + esc(a.owner) + ' → ' + esc(b.owner) + '</p>';
}
function showCNode(id) {
  const n = nodeOf(id), ins = CT.edges.filter(e => e.b === id), outs = CT.edges.filter(e => e.a === id);
  info.innerHTML = '<span class="k">' + LNAME[n.layer] + '</span><h2>' + esc(n.file) + '</h2><div class="t"><code>' + esc(n.path) + '</code></div>' +
    '<p><b>ROS 노드 / 장치</b><br><code>' + esc(n.name) + '</code></p><p>' + esc(n.role) + '</p><h3>관리 담당</h3><p>' + esc(n.owner) + '</p>' +
    '<h3>입력 · 요청받음 (' + ins.length + ')</h3>' + (ins.map(cbtnEdge).join('') || '<div class="t">없음</div>') +
    '<h3>출력 · 요청함 (' + outs.length + ')</h3>' + (outs.map(cbtnEdge).join('') || '<div class="t">없음</div>');
}
info.addEventListener('click', e => {
  if (stage.style.display !== 'none') return;
  const c = e.target.closest('[data-c]'), n = e.target.closest('[data-n]');
  if (c) showContract(c.dataset.c); else if (n) showCNode(n.dataset.n);
});
const h0 = (location.hash || '').slice(1);
if (h0 === 'contracts') renderContracts(); else render(h0 || 'overview');
</script>
